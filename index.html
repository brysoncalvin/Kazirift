<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KaziRift — Kenya Jobs & Business News</title>
<meta name="description" content="KaziRift lists fresh jobs and business news from across Kenya, updated daily." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />

<!--
  MONETAG
  Paste your Monetag site verification / tag script here, right before </head>
  or as instructed in your Monetag dashboard. Turn ON auto-refresh in the
  Monetag panel (do NOT hand-roll a refresh timer yourself — let their
  script manage impression timing so it stays compliant).
  <script src="https://YOUR-MONETAG-SCRIPT-URL"></script>
-->
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-inner">
    <h1 class="wordmark">Kazi<span>Rift</span></h1>
    <span class="dateline" id="dateline"></span>
  </div>
  <div class="wrap tagline">Jobs and business news from every corner of Kenya — updated daily.</div>
  <nav class="tabs wrap">
    <button data-view="jobs" class="active">Jobs</button>
    <button data-view="news">Business News</button>
  </nav>
</header>

<main class="wrap board">
  <aside class="rail">
    <input id="search" class="search-box" type="search" placeholder="Search jobs, companies, towns..." />
    <div class="rail-group">
      <h3>Category</h3>
      <div id="category-rail"></div>
    </div>
    <div class="ad-slot" id="rail-ad"><!-- Adsterra / Monetag banner unit can go here --></div>
  </aside>

  <section>
    <section id="panel-jobs">
      <div class="listings-head">
        <h2>Latest jobs</h2>
        <span class="count" id="result-count"></span>
      </div>
      <div id="listings"></div>
    </section>

    <section id="panel-news" hidden>
      <div class="listings-head">
        <h2>Business news</h2>
      </div>
      <div id="news-list"></div>
    </section>
  </section>
</main>

<footer class="site-footer wrap">
  <span>&copy; <span id="year"></span> KaziRift &mdash; a B Labs product.</span>
  <span>Listings are aggregated from public sources. Verify before paying any fees to apply.</span>
</footer>

<!--
  ADSTERRA — sticky footer banner
  Paste your Adsterra footer/sticky banner ad code inside this div.
  This unit stays visible while scrolling, which is exactly the
  legitimate "sticky footer banner" format Adsterra supports —
  do not hide it with 0px/opacity/off-screen tricks.
-->
<div class="footer-ad-strip" id="footer-ad">
  <!-- Adsterra sticky footer banner script goes here -->
</div>

<script src="app.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("dateline").textContent = new Date().toLocaleDateString("en-KE", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
</script>
</body>
</html>
